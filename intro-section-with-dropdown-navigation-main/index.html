<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Intro Section</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="./images/favicon-32x32.png" />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <a href="#" class="logo">
          <img src="./images/logo.svg" alt="Snap logo" />
        </a>

        <button class="menu-btn" id="menuBtn" aria-label="Open menu">
          <img src="./images/icon-menu.svg" alt="" />
        </button>

        <div class="nav-content" id="navContent">
          <button class="close-btn" id="closeBtn" aria-label="Close menu">
            <img src="./images/icon-close-menu.svg" alt="" />
          </button>

          <ul class="nav-links">
            <li class="dropdown">
              <button class="drop-btn">
                Features
                <img src="./images/icon-arrow-down.svg" alt="" />
              </button>

              <ul class="dropdown-menu features-menu">
                <li>
                  <img src="./images/icon-todo.svg" alt="" />
                  <a href="#">Todo List</a>
                </li>

                <li>
                  <img src="./images/icon-calendar.svg" alt="" />
                  <a href="#">Calendar</a>
                </li>

                <li>
                  <img src="./images/icon-reminders.svg" alt="" />
                  <a href="#">Reminders</a>
                </li>

                <li>
                  <img src="./images/icon-planning.svg" alt="" />
                  <a href="#">Planning</a>
                </li>
              </ul>
            </li>

            <li class="dropdown">
              <button class="drop-btn">
                Company
                <img src="./images/icon-arrow-down.svg" alt="" />
              </button>

              <ul class="dropdown-menu company-menu">
                <li><a href="#">History</a></li>
                <li><a href="#">Our Team</a></li>
                <li><a href="#">Blog</a></li>
              </ul>
            </li>

            <li><a href="#">Careers</a></li>
            <li><a href="#">About</a></li>
          </ul>

          <div class="nav-buttons">
            <a href="#">Login</a>
            <a href="#" class="register">Register</a>
          </div>
        </div>

        <div class="overlay" id="overlay"></div>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-text">
        <h1>Make remote work</h1>

        <p>
          Get your team in sync, no matter your location. <br />
          Streamline processes, create team rituals, and <br />
          watch productivity soar.
        </p>

        <a href="#" class="learn-btn">Learn more</a>

        <div class="clients">
          <img src="./images/client-databiz.svg" alt="" />
          <img src="./images/client-audiophile.svg" alt="" />
          <img src="./images/client-meet.svg" alt="" />
          <img src="./images/client-maker.svg" alt="" />
        </div>
      </div>

      <div class="hero-image">
        <picture>
          <source
            media="(max-width: 768px)"
            srcset="./images/image-hero-mobile.png"
          />

          <img src="./images/image-hero-desktop.png" alt="" />
        </picture>
      </div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
